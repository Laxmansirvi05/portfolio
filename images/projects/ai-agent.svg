<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1c1c22" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141418"/><stop offset="1" stop-color="#0e0e11"/>
    </linearGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#5b6472" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- header -->
  <text x="60" y="86" fill="#f4f4f5" font-size="34" font-weight="800">AI Job&#8209;Search Agent</text>
  <text x="60" y="120" fill="#9aa2b1" font-size="18">Résumé in → ranked internships out · an agentic, multi&#8209;source discovery pipeline</text>
  <g transform="translate(940,64)">
    <rect x="0" y="0" rx="7" width="88" height="30" fill="#EA4B71"/>
    <text x="44" y="20" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">n8n</text>
    <rect x="98" y="0" rx="7" width="70" height="30" fill="#1f1f26" stroke="#33333d"/>
    <text x="133" y="20" fill="#c7d2fe" font-size="14" font-weight="600" text-anchor="middle">LLM</text>
  </g>

  <!-- connectors (drawn first, behind nodes) -->
  <g stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)">
    <line x1="192" y1="400" x2="286" y2="400"/>
    <line x1="384" y1="400" x2="478" y2="400"/>
    <line x1="576" y1="400" x2="670" y2="400"/>
    <line x1="768" y1="400" x2="862" y2="400"/>
    <line x1="960" y1="400" x2="1054" y2="400"/>
  </g>

  <!-- nodes -->
  <!-- 1 Résumé -->
  <g transform="translate(96,352)">
    <rect x="0" y="0" rx="18" width="96" height="96" fill="#22222a" stroke="#6366F1" stroke-width="1.6"/>
    <g transform="translate(30,26)" stroke="#a5b4fc" stroke-width="2.4" fill="none" stroke-linecap="round">
      <rect x="2" y="0" width="32" height="44" rx="4"/><line x1="9" y1="12" x2="27" y2="12"/><line x1="9" y1="22" x2="27" y2="22"/><line x1="9" y1="32" x2="20" y2="32"/>
    </g>
    <text x="48" y="128" fill="#d4d4d8" font-size="16.5" font-weight="600" text-anchor="middle">Résumé PDF</text>
  </g>
  <!-- 2 Build Profile -->
  <g transform="translate(288,352)">
    <rect x="0" y="0" rx="18" width="96" height="96" fill="#22222a" stroke="#f97316" stroke-width="1.6"/>
    <g transform="translate(30,24)" stroke="#fdba74" stroke-width="2.4" fill="none" stroke-linecap="round">
      <circle cx="18" cy="14" r="10"/><path d="M2 46c2-14 32-14 32 0"/>
    </g>
    <text x="48" y="128" fill="#d4d4d8" font-size="16.5" font-weight="600" text-anchor="middle">Build Profile</text>
  </g>
  <!-- 3 Plan Search -->
  <g transform="translate(480,352)">
    <rect x="0" y="0" rx="18" width="96" height="96" fill="#22222a" stroke="#22c55e" stroke-width="1.6"/>
    <g transform="translate(24,24)" stroke="#86efac" stroke-width="2.4" fill="none" stroke-linecap="round">
      <circle cx="24" cy="24" r="22"/><path d="M24 24 L36 12 L28 30 Z" fill="#86efac" stroke="none"/>
    </g>
    <text x="48" y="128" fill="#d4d4d8" font-size="16.5" font-weight="600" text-anchor="middle">Plan Search</text>
  </g>
  <!-- 4 Discover -->
  <g transform="translate(672,352)">
    <rect x="0" y="0" rx="18" width="96" height="96" fill="#22222a" stroke="#6366F1" stroke-width="1.6"/>
    <g transform="translate(24,24)" stroke="#a5b4fc" stroke-width="2.2" fill="none">
      <circle cx="24" cy="24" r="22"/><ellipse cx="24" cy="24" rx="9" ry="22"/><line x1="2" y1="24" x2="46" y2="24"/>
    </g>
    <text x="48" y="128" fill="#d4d4d8" font-size="16.5" font-weight="600" text-anchor="middle">Discover</text>
    <text x="48" y="150" fill="#7c8494" font-size="13" text-anchor="middle">~45 queries</text>
  </g>
  <!-- 5 Extract & Score -->
  <g transform="translate(864,352)">
    <rect x="0" y="0" rx="18" width="96" height="96" fill="#22222a" stroke="#f97316" stroke-width="1.6"/>
    <text x="48" y="60" fill="#fdba74" font-size="34" font-weight="800" text-anchor="middle" font-family="monospace">{ }</text>
    <text x="48" y="128" fill="#d4d4d8" font-size="16.5" font-weight="600" text-anchor="middle">Extract · Score</text>
  </g>
  <!-- 6 Ranked Results -->
  <g transform="translate(1056,352)">
    <rect x="0" y="0" rx="18" width="96" height="96" fill="#22222a" stroke="#22c55e" stroke-width="1.6"/>
    <g transform="translate(26,28)" stroke="#86efac" stroke-width="2.4" fill="none" stroke-linecap="round">
      <line x1="0" y1="6" x2="30" y2="6"/><line x1="0" y1="20" x2="30" y2="20"/><line x1="0" y1="34" x2="18" y2="34"/><path d="M24 32 l4 4 l7 -9" stroke="#4ade80"/>
    </g>
    <text x="48" y="128" fill="#d4d4d8" font-size="16.5" font-weight="600" text-anchor="middle">Ranked Results</text>
  </g>

  <!-- footer guarantees -->
  <g transform="translate(60,600)" font-size="16">
    <g><circle cx="6" cy="-5" r="5" fill="#22c55e"/><text x="20" y="0" fill="#b6bdc9">Every result has a real apply link — never a listing page</text></g>
    <g transform="translate(560,0)"><circle cx="6" cy="-5" r="5" fill="#6366F1"/><text x="20" y="0" fill="#b6bdc9">Provider failover · quality gates · headless-browser fallback</text></g>
    <g transform="translate(0,44)"><circle cx="6" cy="-5" r="5" fill="#f97316"/><text x="20" y="0" fill="#b6bdc9">Nothing invented — weak matches are dropped, not padded</text></g>
    <g transform="translate(560,44)"><circle cx="6" cy="-5" r="5" fill="#EA4B71"/><text x="20" y="0" fill="#b6bdc9">Node.js · n8n · LLM orchestration · Tavily · Playwright</text></g>
  </g>
</svg>
