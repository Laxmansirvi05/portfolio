      <figcaption><div class="num">03</div><h2>Black-hole galaxy</h2>

      <figcaption><div class="num">04</div><h2>Your portrait</h2>

    </figure>

<script type="module">
import * as THREE from 'three';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Palette weighted like the reference: lots of amber + white, then violet, teal, magenta, blue. */
const PALETTE = [
  ['#ffb829', 5], ['#ffd25e', 2], ['#ffffff', 4], ['#8052ff', 3], ['#a98bff', 2],
  ['#15846e', 1], ['#2fd3b0', 2], ['#ff5fa2', 1.5], ['#4f7bff', 1.5]
].flatMap(([c, w]) => Array(Math.round(w * 2)).fill(new THREE.Color(c)));
const pick = () => PALETTE[(Math.random() * PALETTE.length) | 0];

/* Each particle is a point sprite; the fragment shader draws an outlined, rotated triangle. */
const material = () => new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uPx: { value: 1 }, uTime: { value: 0 } },
  vertexShader: `
    attribute vec3 color; attribute float size; attribute float rot; attribute float spin;
    uniform float uPx; uniform float uTime;
    varying vec3 vColor; varying float vRot; varying float vAlpha;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = size * uPx / -mv.z;
      vColor = color; vRot = rot + uTime * spin;
      vAlpha = clamp(1.6 - (-mv.z - 3.2) * 0.45, 0.25, 1.0);   // far side dimmer = depth
    }`,
  fragmentShader: `
    varying vec3 vColor; varying float vRot; varying float vAlpha;
    float tri(vec2 p, float r){
      const float k = 1.7320508;
      p.x = abs(p.x) - r; p.y = p.y + r / k;

      vec2 p = gl_PointCoord * 2.0 - 1.0; p.y = -p.y;
      float c = cos(vRot), s = sin(vRot); p = mat2(c, -s, s, c) * p;

      if (a < 0.01) discard;
      gl_FragColor = vec4(vColor, a * vAlpha);
    }`
});

/* Shared harness: a renderer per stage, assembly from scattered positions, mouse tilt, click to replay. */
function makeStage(el, { count, shape, ambient = 70, camZ = 4.6 }) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  el.prepend(renderer.domElement);
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(40, 1, .1, 100);
  cam.position.z = camZ;
  const group = new THREE.Group(); scene.add(group);

  const n = count + ambient;
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  const size = new Float32Array(n), rot = new Float32Array(n), spin = new Float32Array(n);
  const scatter = new Float32Array(n * 3), delay = new Float32Array(n);
  for (let i = 0; i < n; i++) {

    rot[i] = Math.random() * 6.28; spin[i] = (Math.random() - .5) * (amb ? .4 : .8);

  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('rot', new THREE.BufferAttribute(rot, 1));
  geo.setAttribute('spin', new THREE.BufferAttribute(spin, 1));
  const mat = material(), pts = new THREE.Points(geo, mat);
  group.add(pts);

  // Ambient triangles: fixed, sparse, around the object.
  const ambientPos = [];
  for (let i = 0; i < ambient; i++) ambientPos.push([(Math.random() - .5) * 6, (Math.random() - .5) * 7, (Math.random() - .5) * 3 - 1]);

  let start = performance.now(), mx = 0, my = 0, tx = 0, ty = 0;
  el.addEventListener('pointermove', e => {
    const r = el.getBoundingClientRect();

  });

  el.addEventListener('click', () => { start = performance.now(); });

  const out = [0, 0, 0];
  const tag = document.createElement('span'); tag.className = 'tag'; el.appendChild(tag);
  function resize() {
    const w = el.clientWidth, h = el.clientHeight;
    renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
    mat.uniforms.uPx.value = h * renderer.getPixelRatio() * 0.004;
  }
  new ResizeObserver(resize).observe(el); resize();

  function frame(now) {
    const t = reduced ? 3 : (now - start) / 1000;
    mat.uniforms.uTime.value = t;
    for (let i = 0; i < count; i++) {
      shape.at(i, t, out);
      const k = Math.min(Math.max((t - delay[i]) / 1.8, 0), 1), e = 1 - Math.pow(1 - k, 3);
      pos[i * 3]     = scatter[i * 3]     + (out[0] - scatter[i * 3])     * e;
      pos[i * 3 + 1] = scatter[i * 3 + 1] + (out[1] - scatter[i * 3 + 1]) * e;
      pos[i * 3 + 2] = scatter[i * 3 + 2] + (out[2] - scatter[i * 3 + 2]) * e;
    }
    for (let j = 0; j < ambient; j++) {
      const i = count + j, p = ambientPos[j];
      pos[i * 3] = p[0]; pos[i * 3 + 1] = p[1] + Math.sin(now / 2000 + j) * .05; pos[i * 3 + 2] = p[2];
    }
    geo.attributes.position.needsUpdate = true;
    tx += (mx - tx) * .05; ty += (my - ty) * .05;
    shape.orient(group, reduced ? 0 : now / 1000, tx, ty);
    if (shape.label) { const l = shape.label(t); if (tag.textContent !== l) tag.textContent = l; }
    renderer.render(scene, cam);
    requestAnimationFrame(frame);
  }

}

/* Sample points on a triangle, half on its edges so the low-poly facets read clearly. */
function sampleTri(a, b, c, onEdge) {
  if (onEdge) {
    const e = (Math.random() * 3) | 0, t = Math.random();
    const [p, q] = e === 0 ? [a, b] : e === 1 ? [b, c] : [c, a];
    return [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, p[2] + (q[2] - p[2]) * t];
  }
  let u = Math.random(), v = Math.random(); if (u + v > 1) { u = 1 - u; v = 1 - v; }
  return [0, 1, 2].map(k => a[k] + (b[k] - a[k]) * u + (c[k] - a[k]) * v);
}
const area = (a, b, c) => {
  const u = [b[0]-a[0], b[1]-a[1], b[2]-a[2]], v = [c[0]-a[0], c[1]-a[1], c[2]-a[2]];
  return Math.hypot(u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]) / 2;

/* ---------- 01 Origami crane: low-poly faces; wing points rotate about the body to flap ---------- */
function crane(count) {
  const Z = .16, faces = [
    // body (diamond prism)
    [[.55,0,0],[0,.22,0],[0,-.02,Z],'b'], [[.55,0,0],[0,-.32,0],[0,-.02,Z],'b'],
    [[-.55,0,0],[0,.22,0],[0,-.02,Z],'b'], [[-.55,0,0],[0,-.32,0],[0,-.02,Z],'b'],
    [[.55,0,0],[0,.22,0],[0,-.02,-Z],'b'], [[.55,0,0],[0,-.32,0],[0,-.02,-Z],'b'],
    [[-.55,0,0],[0,.22,0],[0,-.02,-Z],'b'], [[-.55,0,0],[0,-.32,0],[0,-.02,-Z],'b'],
    // neck + head
    [[.35,-.05,.04],[.65,-.18,0],[1.25,.95,0],'b'], [[.35,-.05,-.04],[.65,-.18,0],[1.25,.95,0],'b'],
    [[1.25,.95,0],[1.18,.84,.03],[1.55,.78,0],'b'], [[1.25,.95,0],[1.18,.84,-.03],[1.55,.78,0],'b'],
    // tail
    [[-.35,-.05,.04],[-.65,-.18,0],[-1.35,.9,0],'b'], [[-.35,-.05,-.04],[-.65,-.18,0],[-1.35,.9,0],'b'],
    // wings (inner + outer panel each side)
    [[-.42,.18,0],[.42,.18,0],[-.05,.2,.75],'L'], [[-.05,.2,.75],[.25,.2,.7],[-.45,.25,1.55],'L'],
    [[-.42,.18,0],[.42,.18,0],[-.05,.2,-.75],'R'], [[-.05,.2,-.75],[.25,.2,-.7],[-.45,.25,-1.55],'R'],
  ];
  const tot = faces.reduce((s, f) => s + area(f[0], f[1], f[2]), 0);
  const base = [], part = [];
  faces.forEach(f => {
    const m = Math.max(6, Math.round(count * area(f[0], f[1], f[2]) / tot));
    for (let i = 0; i < m && base.length < count; i++) { base.push(sampleTri(f[0], f[1], f[2], Math.random() < .55)); part.push(f[3]); }
  });
  while (base.length < count) { base.push(sampleTri(...faces[0].slice(0, 3), false)); part.push('b'); }

    at(i, t, o) {
      const p = base[i], w = part[i];
      if (w === 'b') { o[0] = p[0]; o[1] = p[1]; o[2] = p[2]; return; }

    },
    orient(g, s, mx, my) { g.rotation.set(.25 + my * .25, -.6 + Math.sin(s * .25) * .5 + mx * .5, .05); g.position.y = Math.sin(s * .8) * .06 - .25; g.scale.setScalar(.85); }
  };

/* ---------- 02 Möbius ribbon: particles flow along u, spread across the band width v ---------- */
function mobius(count) {
  const uv = Array.from({ length: count }, () => [Math.random() * Math.PI * 2, (Math.random() - .5) * (Math.random() < .35 ? 1 : .98)]);
  const edge = uv.map(([, v]) => Math.abs(v) > .42);
  return {
    at(i, t, o) {
      const u = uv[i][0] + t * .18, v = uv[i][1] * .62, R = 1.15;
      const h = Math.cos(u / 2) * v;

    },
    orient(g, s, mx, my) { g.rotation.set(1.05 + my * .3, s * .12 + mx * .5, .35); g.scale.setScalar(.9); }
  };
}

/* ---------- 03 Black-hole galaxy: 3 spiral arms, empty core, Keplerian-ish orbit speeds ---------- */
function galaxy(count) {
  const st = Array.from({ length: count }, (_, i) => {
    const ring = i < count * .18;                       // bright accretion ring around the core
    const r = ring ? .38 + Math.random() * .12 : .5 + Math.pow(Math.random(), .8) * 1.4;
    const arm = (i % 3) * (Math.PI * 2 / 3);
    const a = ring ? Math.random() * 6.28 : arm + r * 3.2 + (Math.random() - .5) * (.28 + r * .14);
    return [r, a, (Math.random() - .5) * (ring ? .03 : .16 * (1.6 - r * .5))];

  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.strokeStyle = '#fff'; draw(x);
  const d = x.getImageData(0, 0, w, h).data, s = 2 / Math.max(w, h), out = [];
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++)
    if (d[(y * w + i) * 4 + 3] > 128) out.push([(i - w / 2) * s, -(y - h / 2) * s]);
  return out;
}
const rnd = a => a[(Math.random() * a.length) | 0];
const C = h => new THREE.Color(h);

/* ---------- 04 Portrait: photo luminance → density, depth and colour ---------- */
function portrait(count) {
  const P = window.PORTRAIT, src = [];
  for (let i = 0; i < P.p.length; i += 3) src.push([P.p[i], P.p[i + 1], P.p[i + 2] / 99]);
  const pts = [];
  while (pts.length < count) {                        // brighter pixels get more particles
    const q = rnd(src); if (Math.random() < Math.pow(q[2], 1.6) * 1.4) pts.push(q);   // strong contrast: eyes/brows stay dark
  }
  const s = 2.3 / P.w;
  const base = pts.map(([x, y, l]) => [(x + Math.random() - P.w / 2) * s, -(y + Math.random() - P.h / 2) * s, l * .55 - .2]);
  const tones = [[.72, ['#ffffff', '#ffd25e', '#ffb829']], [.5, ['#ffb829', '#a98bff', '#ffffff']], [.3, ['#8052ff', '#4f7bff', '#ff5fa2']], [0, ['#4f7bff', '#15846e', '#8052ff']]];
  return {
    sizeScale: .7,
    color: i => C(rnd(tones.find(([th]) => pts[i][2] >= th)[1])),
    at(i, t, o) {
      const b = base[i];
      o[0] = b[0]; o[1] = b[1]; o[2] = b[2] + Math.sin(t * 1.4 + b[1] * 4) * .03;
    },
    orient(g, s, mx, my) { g.rotation.set(my * .2, Math.sin(s * .3) * .3 + mx * .5, 0); g.scale.setScalar(1.25); g.position.y = -.05; }
  };
}

/* ---------- 05 Folding morph: LS → crane → radar dish → globe, looping ---------- */
function morph(count) {
  const ls = canvasPoints(420, 260, x => { x.font = '700 220px Inter, Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('LS', 210, 138); })
    .map(p => p);
  const cr = crane(count), tmp = [0, 0, 0];
  const shapes = [
    i => { const p = ls[(i * 7919) % ls.length]; return [p[0] * 1.35, p[1] * 1.35, (Math.random() - .5) * .25]; },
    i => { cr.at(i, 0, tmp); return [tmp[0] * .95, tmp[1] * .95 - .15, tmp[2] * .95]; },
    i => {                                                         // dish facing the viewer + feed arm
      if (i % 9 === 0) { const k = Math.random(); return [0, -.15 + k * .05, -.35 + k * 1.05]; }
      const r = Math.sqrt(Math.random()) * 1.15, a = Math.random() * 6.28;
      const rr = Math.random() < .3 ? Math.round(r * 4) / 4 : r;    // concentric ribs
      return [Math.cos(a) * rr, Math.sin(a) * rr - .15, rr * rr * .42 - .35];
    },
    i => {                                                         // globe with meridians + parallels
      let la, lo;
      if (i % 3 === 0) { la = Math.acos(2 * Math.random() - 1); lo = Math.round(Math.random() * 12) / 12 * 6.28; }
      else if (i % 3 === 1) { la = Math.round(Math.random() * 8 + .5) / 9 * Math.PI; lo = Math.random() * 6.28; }
      else { la = Math.acos(2 * Math.random() - 1); lo = Math.random() * 6.28; }
      return [Math.sin(la) * Math.cos(lo) * 1.1, Math.cos(la) * 1.1, Math.sin(la) * Math.sin(lo) * 1.1];
    }
  ];
  const names = ['LS monogram', 'Crane', 'Radar dish', 'Globe'];
  const T = shapes.map(f => Array.from({ length: count }, (_, i) => f(i)));
  const HOLD = 2.4, MOVE = 1.4, CYCLE = HOLD + MOVE;
  const phase = t => { const k = Math.max(t - 1.8, 0) / CYCLE, a = Math.floor(k) % 4, f = (k % 1) * CYCLE; return [a, f < HOLD ? 0 : (f - HOLD) / MOVE]; };
  return {
    label: t => names[phase(t)[0]],
    at(i, t, o) {
      const [a, f] = phase(t), b = (a + 1) % 4, e = f < .5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2;
      const p = T[a][i], q = T[b][i], lift = Math.sin(f * Math.PI) * .35;   // particles bulge outward mid-fold
      o[0] = p[0] + (q[0] - p[0]) * e; o[1] = p[1] + (q[1] - p[1]) * e; o[2] = p[2] + (q[2] - p[2]) * e + lift * ((i % 2) * 2 - 1);
    },
    orient(g, s, mx, my) { g.rotation.set(.15 + my * .25, Math.sin(s * .4) * .45 + mx * .5, 0); g.scale.setScalar(.95); }
  };
}

/* ---------- 06 Particle hand: palm + fingers silhouette with depth; sparks rise from the tips ---------- */
function hand(count) {
  const W = 300, H = 400;
  const fingers = [[100, 200, 90, 72, 32], [140, 192, 140, 52, 33], [180, 198, 190, 70, 31], [214, 220, 238, 118, 27], [88, 285, 28, 205, 36]];
  const sil = canvasPoints(W, H, x => {
    x.beginPath(); x.roundRect(78, 185, 150, 150, 40); x.fill();
    x.fillRect(108, 300, 92, 100);
    x.lineCap = 'round';
    for (const [x1, y1, x2, y2, w] of fingers) { x.lineWidth = w; x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke(); }
  });
  const s = 2 / H, tips = fingers.map(([, , x2, y2]) => [(x2 - W / 2) * s * 1.5, -(y2 - H / 2) * s * 1.5]);
  const nSpark = Math.round(count * .16), body = count - nSpark;
  const base = Array.from({ length: body }, () => {
    const [x, y] = rnd(sil), X = x * 1.5, Y = y * 1.5;
    const bulge = Math.max(0, .22 - Math.hypot(X + .02, Y + .2) * .28);   // palm is thicker in the middle
    return [X, Y, (Math.random() - .5) * .14 + bulge];
  });
  const spark = Array.from({ length: nSpark }, (_, i) => ({ tip: tips[i % 5], ph: Math.random(), dx: (Math.random() - .5) * .5, sp: .25 + Math.random() * .25 }));
  return {
    at(i, t, o) {
      if (i < body) { const b = base[i]; o[0] = b[0]; o[1] = b[1]; o[2] = b[2] + Math.sin(t + b[1] * 2) * .02; return; }
      const k = spark[i - body], f = (k.ph + t * k.sp) % 1;          // rise, drift and widen, then loop
      o[0] = k.tip[0] + k.dx * f + Math.sin(t * 2 + k.ph * 9) * .05 * f;
      o[1] = k.tip[1] + .05 + f * 1.1;
      o[2] = (k.ph - .5) * .4 * f;
    },
    orient(g, s, mx, my) { g.rotation.set(-.1 + my * .25, Math.sin(s * .35) * .35 + mx * .5, -.08); g.scale.setScalar(.82); g.position.y = -.35; }
  };
}

makeStage(document.getElementById('crane'),  { count: 3600, shape: crane(3600) });
makeStage(document.getElementById('portrait'), { count: 6500, shape: portrait(6500), ambient: 40 });
makeStage(document.getElementById('morph'),  { count: 3600, shape: morph(3600) });
makeStage(document.getElementById('hand'),   { count: 3800, shape: hand(3800) });
makeStage(document.getElementById('mobius'), { count: 3600, shape: mobius(3600) });
makeStage(document.getElementById('galaxy'), { count: 4200, shape: galaxy(4200) });
</script>
