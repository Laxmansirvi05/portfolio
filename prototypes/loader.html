<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tear Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#000; --white:#fff; --ash:#9a9a9a; --silver:#bdbdbd;
    --iris:#8052ff; --saffron:#ffb829; --verdant:#15846e;
    --font:'PP Neue Montreal','Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--void);color:var(--white);font-family:var(--font);overflow:hidden;
    font-feature-settings:"ss01" on;-webkit-font-smoothing:antialiased}

  /* ---------- the site underneath (stand-in hero) ---------- */
  #field{position:fixed;inset:0;width:100%;height:100%}
  .hero{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:0 max(16px,6vw);max-width:1280px;pointer-events:none}
  .hero h1{font-weight:400;font-size:clamp(52px,9vw,113px);line-height:1;letter-spacing:-.04em}
  .hero .label{margin-top:30px;font-size:14px;font-weight:600;letter-spacing:.025em;text-transform:uppercase;color:var(--saffron)}
  .hero p{margin-top:12px;max-width:480px;font-size:18px;font-weight:200;line-height:1.5}
  .hero .cta{pointer-events:auto;align-self:flex-start;margin-top:30px;background:var(--iris);color:#fff;border:0;
    border-radius:24px;padding:14.4px 18px;font:600 14px var(--font);letter-spacing:.025em;text-transform:uppercase;cursor:pointer}

  /* ---------- loader: one "sheet" rendered twice, each half clipped along the crack ---------- */
  .loader{position:fixed;inset:0;z-index:10;pointer-events:none}
  .half{position:absolute;inset:0;will-change:transform;
    transition:transform 1.25s cubic-bezier(.7,0,.25,1)}
  .paper{position:absolute;inset:0;background:#000 center/100% 100% no-repeat}
  .crack{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .crack .line{fill:none;stroke:var(--silver);stroke-width:1.4;stroke-linejoin:miter}
  .crack .edge{fill:none;stroke:url(#edgeGrad);stroke-width:0;stroke-linejoin:miter;
    filter:drop-shadow(0 0 6px rgba(128,82,255,.9));transition:stroke-width .25s ease}

  .counter{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;display:grid;place-items:center}
  .counter svg{position:absolute;inset:0;width:100%;height:100%}
  .counter .outer{animation:spin 9s linear infinite}
  .counter .inner{animation:spin 6s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .counter circle{fill:none;transform-origin:50% 50%}
  .counter b{position:relative;font-weight:500;font-size:30px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
    text-shadow:0 0 6px #000,0 0 12px #000,0 0 18px #000}

  body.snap .half{animation:shake .28s steps(2) 1}
  @keyframes shake{25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,0)}}
  body.snap .crack .edge{stroke-width:3}
  body.open .left {transform:translateX(-62vw) rotate(-2.5deg)}
  body.open .right{transform:translateX(62vw) rotate(2.5deg)}

  /* ---------- name intro: revealed by the tear, outline draws in, then fills ---------- */
  .intro{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#000;padding:0 16px;
    transition:opacity .7s ease, visibility 0s linear .7s}
  .intro svg{width:min(1000px,92vw);height:auto;overflow:visible}
  .intro text{font:500 120px var(--font);letter-spacing:-.04em;
    fill:#fff;fill-opacity:0;stroke:#fff;stroke-width:1.4;stroke-dasharray:420;stroke-dashoffset:420}
  .intro .dot{fill:var(--iris);stroke:var(--iris)}
  body.open .intro text{animation:draw 1.9s cubic-bezier(.45,0,.2,1) .35s forwards, fill .7s ease 2.05s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fill{to{fill-opacity:1;stroke-width:0}}
  body.intro-out .intro{opacity:0;visibility:hidden}
  .hero{opacity:0;transform:translateY(24px);transition:opacity 1s ease .1s, transform 1s cubic-bezier(.2,.8,.2,1) .1s}
  body.intro-out .hero{opacity:1;transform:none}

  .replay{position:fixed;right:16px;bottom:16px;z-index:20;background:none;border:0;color:var(--ash);
    font:600 12px var(--font);letter-spacing:.025em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity .4s}
  .replay:hover{color:#fff}
  body.done .replay{opacity:1}

  @media (prefers-reduced-motion:reduce){
    .half{transition:opacity .4s}
    body.open .half{transform:none;opacity:0}
    .counter .outer,.counter .inner{animation:none}
    body.open .intro text{animation:none;fill-opacity:1;stroke-width:0}
  }
</style>
</head>
<body>
  <canvas id="field"></canvas>
  <section class="hero">
    <h1>Laxman<br>Sirvi.</h1>
    <div class="label">AI &amp; Full-Stack Developer</div>
    <p>I build AI products end to end — from PostgreSQL and Spring Boot to agentic search and real-time voice.</p>
    <button class="cta">View my work</button>
  </section>

  <div class="intro" aria-label="Laxman Sirvi">
    <svg viewBox="0 0 1000 170" aria-hidden="true">
      <text x="500" y="125" text-anchor="middle">Laxman Sirvi<tspan class="dot">.</tspan></text>
    </svg>
  </div>
  <div class="loader" id="loader" aria-hidden="true"></div>
  <button class="replay" id="replay">Replay ↻</button>

<script>
(() => {
  const loader = document.getElementById('loader');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, pts, pathLen, halves = [], counters = [];

  /* Pure black void with a sparse, faint field of outlined triangles (the theme's ambient particles),
     drawn once to an image so both halves show the same sky and it splits cleanly along the crack. */
  function paperURL(w, h) {
    const c = document.createElement('canvas'), dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = w * dpr; c.height = h * dpr;
    const x = c.getContext('2d'); x.scale(dpr, dpr);
    x.fillStyle = '#000'; x.fillRect(0, 0, w, h);
    const cols = ['#8052ff', '#ffb829', '#15846e', '#a98bff', '#4f7bff'];
    const n = Math.round(w * h / 9000);
    for (let i = 0; i < n; i++) {
      const s = 2 + Math.random() * (Math.random() < .1 ? 9 : 4), r = Math.random() * 6.28;
      x.save(); x.translate(Math.random() * w, Math.random() * h); x.rotate(r);
      x.strokeStyle = cols[i % cols.length]; x.globalAlpha = .1 + Math.random() * .22; x.lineWidth = 1;
      x.beginPath(); x.moveTo(0, -s); x.lineTo(s * .87, s * .5); x.lineTo(-s * .87, s * .5); x.closePath(); x.stroke();
      x.restore();
    }
    return `url(${c.toDataURL('image/png')})`;
  }

  /* Jagged crack from top to bottom, wandering around the centre line. */
  function makeCrack() {
    const segs = 9 + Math.round(Math.random() * 3), p = [];
    for (let i = 0; i <= segs; i++) {
      const y = (i / segs) * H;
      const swing = (i % 2 ? 1 : -1) * (14 + Math.random() * 34);
      p.push([W / 2 + (i === 0 ? 0 : swing), y]);
    }
    p[0][1] = -4; p[segs][1] = H + 4;
    return p;
  }

  function sheet(side) {
    const el = document.createElement('div');
    el.className = 'half ' + side;
    const poly = pts.map(([x, y]) => `${x}px ${y}px`).join(',');
    el.style.clipPath = side === 'left'
      ? `polygon(-10px -10px, ${poly}, -10px ${H + 10}px)`
      : `polygon(${W + 10}px -10px, ${poly}, ${W + 10}px ${H + 10}px)`;
    const d = 'M' + pts.map(p => p.join(' ')).join(' L');
    el.innerHTML = `
      <div class="paper"></div>
      <svg class="crack" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs><linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8052ff"/><stop offset=".55" stop-color="#ffb829"/><stop offset="1" stop-color="#15846e"/>
        </linearGradient></defs>
        <path class="edge" d="${d}"/>
        <path class="line" d="${d}"/>
      </svg>
      <div class="counter">
        <svg viewBox="0 0 132 132">
          <circle class="outer" cx="66" cy="66" r="60" stroke="#9a9a9a" stroke-width="2.2" stroke-dasharray="15 10" stroke-linecap="round"/>
          <circle class="inner" cx="66" cy="66" r="48" stroke="#8052ff" stroke-opacity=".75" stroke-width="1.2" stroke-dasharray="5 7"/>
        </svg>
        <b>0%</b>
      </div>`;
    el.querySelector('.paper').style.backgroundImage = bg;
    return el;
  }

  let bg;
  function build() {
    W = innerWidth; H = innerHeight;
    pts = makeCrack(); bg = paperURL(W, H);
    loader.innerHTML = '';
    halves = [sheet('left'), sheet('right')];
    halves.forEach(h => loader.appendChild(h));
    counters = [...loader.querySelectorAll('.counter b')];
    const line = loader.querySelector('.line');
    pathLen = line.getTotalLength();
    loader.querySelectorAll('.line,.edge').forEach(l => {
      l.style.strokeDasharray = pathLen; l.style.strokeDashoffset = pathLen;
    });
  }

  function setProgress(v) {
    counters.forEach(c => c.textContent = v + '%');
    const off = pathLen * (1 - v / 100);
    loader.querySelectorAll('.line,.edge').forEach(l => l.style.strokeDashoffset = off);
  }

  /* Irregular progress like a real load: bursts, then short holds (e.g. around 87%). */
  let v = 0;
  function run() {
    document.body.className = '';
    // restart the intro's CSS animation on replay
    const t = document.querySelector('.intro text'); t.style.animation = 'none'; t.getBBox(); t.style.animation = '';
    loader.style.display = '';
    build();
    v = 0;
    const step = () => {
      v = Math.min(100, v + (v > 80 && v < 90 ? 1 : 2 + Math.floor(Math.random() * 7)));
      setProgress(v);
      if (v < 100) return setTimeout(step, reduced ? 10 : (v > 84 && v < 90 ? 160 : 45 + Math.random() * 70));
      setTimeout(() => {
        document.body.classList.add('snap');                       // crack glows, page jolts
        setTimeout(() => document.body.classList.add('open'), 320); // halves tear apart
        setTimeout(() => { loader.style.display = 'none'; }, 1600);
        // name draws (0.35s → 2.25s), fills, holds, then the intro fades into the site
        setTimeout(() => document.body.classList.add('intro-out', 'done'), reduced ? 900 : 4000);
      }, 380);
    };
    setTimeout(step, 250);
  }

  /* ---------- ambient triangle field for the revealed hero ---------- */
  const cv = document.getElementById('field'), ctx = cv.getContext('2d');
  const COLORS = ['#8052ff', '#ffb829', '#15846e', '#c04cff', '#4f7bff', '#ff5fa2', '#a98bff'];
  let tris = [];
  function seed() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(innerWidth * innerHeight / 900);
    const cx = innerWidth * (innerWidth > 800 ? .68 : .5), cy = innerHeight * .5, r = Math.min(innerWidth, innerHeight) * .34;
    tris = Array.from({ length: n }, (_, i) => {
      const cloud = i < n * .82, a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random());
      return {
        x: cloud ? cx + Math.cos(a) * r * 1.35 * d : Math.random() * innerWidth,
        y: cloud ? cy + Math.sin(a) * r * .8 * d : Math.random() * innerHeight,
        s: cloud ? 2 + Math.random() * 4 : 4 + Math.random() * 12,
        c: COLORS[i % COLORS.length], o: cloud ? .55 + Math.random() * .45 : .18 + Math.random() * .25,
        rot: Math.random() * 6.28, vr: (Math.random() - .5) * .01, ph: Math.random() * 6.28
      };
    });
  }
  function draw(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of tris) {
      const bob = reduced ? 0 : Math.sin(t / 1600 + p.ph) * 3;
      p.rot += reduced ? 0 : p.vr;
      ctx.save(); ctx.translate(p.x, p.y + bob); ctx.rotate(p.rot);
      ctx.strokeStyle = p.c; ctx.globalAlpha = p.o; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, -p.s); ctx.lineTo(p.s * .87, p.s * .5); ctx.lineTo(-p.s * .87, p.s * .5); ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }

  // On resize, re-cut the crack for the new size but keep the current progress.
  addEventListener('resize', () => {
    seed();
    if (!document.body.classList.contains('snap')) { build(); setProgress(v); }
  });
  document.getElementById('replay').onclick = run;
  seed(); requestAnimationFrame(draw); run();
})();
</script>
</body>
</html>
